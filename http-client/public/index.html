<!DOCTYPE html>
<html>
  <head>
    <title>GraphQL Client</title>
  </head>
  <body>
    <div id="root">
      I'm loading...!
    </div>
    <!--
      No type="module" here, and the comment that used to claim it was important has
      gone with it. index.js is a plain script: it cannot import from ../../constants
      the way the Node processes do, because the browser has no access to the repo.
      Adding type="module" without an actual import changes nothing except making the
      script defer.
    -->
    <!-- config.js first: it defines window.__APP_CONFIG__, which index.js reads. It is
         generated by http-client/index.js from constants.js rather than being a file on
         disk, which is what lets APOLLO_URL and APOLLO_PORT actually reach the browser. -->
    <script src="config.js"></script>
    <script src="index.js"></script>
  </body>
</html>
